[project]
name = "fuelwatch-wa"
version = "0.1.0"
description = "FuelWatch WA prices, vehicle costs, and Home Assistant dashboard"
requires-python = ">=3.14.2"
dependencies = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
