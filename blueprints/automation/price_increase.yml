blueprint:
  name: FuelWatch — next-period price increase
  description: Run your selected action when a next-period change exceeds your threshold. Select a FuelWatch next-period change sensor. At most one alert per 20 hours.
  domain: automation
  input:
    change_entity:
      name: Next-period change sensor (c/L)
      selector:
        entity:
          domain: sensor
          integration: fuelwatch_wa
    threshold:
      name: Minimum increase (c/L)
      default: 5
      selector:
        number:
          min: 0
          max: 100
          mode: box
    action_to_run:
      name: Action to run
      selector:
        action: {}
triggers:
  - trigger: state
    entity_id: !input change_entity
conditions:
  - condition: numeric_state
    entity_id: !input change_entity
    above: !input threshold
  - condition: template
    value_template: "{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds() > 72000 }}"
actions: !input action_to_run
mode: single
